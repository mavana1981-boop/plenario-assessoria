<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Usuários CCJC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .header { background: linear-gradient(135deg, #1a3a6b 0%, #2a5298 100%); color: #fff; padding: 0.75rem 0; }
    .titulo-app { font-size: 1.3rem; font-weight: 700; margin: 0; }
    .subtitulo-app { font-size: 0.85rem; margin: 0; opacity: 0.9; }
    .logo { width: 75px; }
    .logo-pl { height: 42px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="container d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center">
        <div class="me-3 d-flex flex-column align-items-center">
          <img src="/static/logo_minoria.png" class="logo" onerror="this.style.display='none'">
          <img src="/static/logo_oposicao.png" class="logo-pl mt-1" onerror="this.style.display='none'">
        </div>
        <div>
          <h1 class="titulo-app mb-0">Gerenciar Usuários</h1>
          <p class="subtitulo-app mb-0">Assessoria CCJC</p>
        </div>
      </div>
      <div>
        <a href="{{ url_for('selecionar_data') }}" class="btn btn-outline-light btn-sm me-1">
          <i class="fas fa-arrow-left me-1"></i>Voltar
        </a>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">
          <i class="fas fa-sign-out-alt me-1"></i>Sair
        </a>
      </div>
    </div>
  </div>

  <div class="container my-4" style="max-width:700px;">
    <div id="msg-container"></div>

    <div class="card mb-4">
      <div class="card-header bg-primary text-white">
        <i class="fas fa-user-plus me-2"></i>Adicionar Usuário
      </div>
      <div class="card-body">
        <div class="row g-2">
          <div class="col-md-4">
            <input type="text" id="new-username" class="form-control form-control-sm" placeholder="Usuário">
          </div>
          <div class="col-md-4">
            <input type="password" id="new-password" class="form-control form-control-sm" placeholder="Senha">
          </div>
          <div class="col-md-3">
            <select id="new-role" class="form-control form-control-sm">
              <option value="Assessor">Assessor</option>
              <option value="Assessor Plenário">Assessor Plenário</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
          <div class="col-md-1">
            <button class="btn btn-success btn-sm w-100" onclick="addUsuario()">
              <i class="fas fa-plus"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header bg-light">
        <i class="fas fa-users me-2"></i>Usuários cadastrados
      </div>
      <div class="card-body p-0">
        <table class="table table-sm table-hover mb-0">
          <thead class="table-light">
            <tr><th>#</th><th>Usuário</th><th>Perfil</th><th></th></tr>
          </thead>
          <tbody id="tabela-usuarios">
            {% for u in usuarios %}
            <tr id="row-{{ u[0] }}">
              <td>{{ u[0] }}</td>
              <td>{{ u[1] }}</td>
              <td><span class="badge bg-secondary">{{ u[2] }}</span></td>
              <td>
                <button class="btn btn-danger btn-sm py-0" onclick="deleteUsuario({{ u[0] }}, '{{ u[1] }}')">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function showMsg(msg, type='success') {
      const c = document.getElementById('msg-container');
      c.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show py-2">${msg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
    }

    async function addUsuario() {
      const username = document.getElementById('new-username').value.trim();
      const password = document.getElementById('new-password').value.trim();
      const role = document.getElementById('new-role').value;
      if (!username || !password) return showMsg('Preencha usuário e senha.', 'warning');
      const r = await fetch('/admin/usuarios/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password, role})
      });
      const j = await r.json();
      if (j.error) return showMsg(j.error, 'danger');
      showMsg(j.message);
      document.getElementById('new-username').value = '';
      document.getElementById('new-password').value = '';
      setTimeout(() => location.reload(), 1200);
    }

    async function deleteUsuario(id, nome) {
      if (!confirm(`Remover usuário "${nome}"?`)) return;
      const r = await fetch(`/admin/usuarios/delete/${id}`, {method: 'POST'});
      const j = await r.json();
      if (j.error) return showMsg(j.error, 'danger');
      document.getElementById(`row-${id}`)?.remove();
      showMsg(j.message);
    }
  </script>
</body>
</html>
