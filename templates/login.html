<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessoria de Plenário - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
    .header { background: #fff; border-bottom: 3px solid #1A6B3A; padding: 0.7rem 0; }
    .login-container {
      max-width: 420px; margin: 2.5rem auto; padding: 2rem;
      background: #fff; border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
    }
    .btn-login { background: #1A6B3A; border-color: #1A6B3A; color: #fff; }
    .btn-login:hover { background: #155c30; color: #fff; }
    .form-select, .form-control { border-color: #ced4da; }
    .form-select:focus, .form-control:focus {
      border-color: #1A6B3A; box-shadow: 0 0 0 0.2rem rgba(26,107,58,.15);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="container d-flex align-items-center gap-3">
      <img src="/static/logo_minoria.png" style="width:80px;height:50px;object-fit:contain;" onerror="this.style.display='none'">
      <img src="/static/logo_oposicao.png" style="width:80px;height:50px;object-fit:contain;" onerror="this.style.display='none'">
      <div>
        <h1 style="font-size:1.4rem;font-weight:700;color:#1A6B3A;margin:0;">Assessoria de Plenário</h1>
        <p style="font-size:0.85rem;color:#555;margin:0;">Lideranças da Minoria e da Oposição — Câmara dos Deputados</p>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="login-container">
      <h5 class="mb-4 text-center" style="color:#1A6B3A;">
        <i class="fas fa-lock me-2"></i>Acesse sua conta
      </h5>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show py-2">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label class="form-label fw-bold small">
            <i class="fas fa-user me-1"></i>Usuário
          </label>
          <select class="form-select" name="username" id="username" required>
            <option value="">— selecione seu usuário —</option>
            {% for u in usuarios %}
            <option value="{{ u.username }}">{{ u.username }}{% if u.categoria not in ('geral','admin') %} ({{ u.categoria }}){% endif %}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold small">
            <i class="fas fa-key me-1"></i>Senha
          </label>
          <input type="password" class="form-control" name="password" required placeholder="Digite sua senha">
        </div>
        <button type="submit" class="btn btn-login w-100 py-2">
          <i class="fas fa-sign-in-alt me-2"></i>Entrar
        </button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
