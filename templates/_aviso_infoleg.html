{# Toast dos avisos do Infoleg (tempo real) — aparece nas telas da pauta quando chega aviso novo #}
<div id="toastsInfoleg" class="ti-pilha" aria-live="polite"></div>
<style>
.ti-pilha{position:fixed;top:14px;right:14px;z-index:1090;display:flex;flex-direction:column;gap:8px;width:360px;max-width:calc(100vw - 28px)}
.ti-toast{background:#0A1628;color:#fff;border-left:4px solid #f39c12;border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.25);padding:10px 30px 10px 12px;position:relative;font-size:.88rem;animation:tiEntra .35s ease-out;cursor:pointer}
.ti-toast b{display:block;font-size:.9rem;margin-bottom:2px}
.ti-toast small{color:#9fb3cc;font-size:.72rem}
.ti-toast .ti-x{position:absolute;top:4px;right:8px;background:none;border:0;color:#9fb3cc;font-size:18px;line-height:1;cursor:pointer}
@keyframes tiEntra{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:576px){.ti-pilha{left:10px;right:10px;width:auto}}
</style>
<script>
(function(){
  var pilha = document.getElementById('toastsInfoleg');
  if (!pilha) return;
  var ultimo = null;
  function esc(t){ var d=document.createElement('div'); d.textContent=t||''; return d.innerHTML; }
  function mostrar(a){
    var el = document.createElement('div');
    el.className = 'ti-toast';
    el.innerHTML = '<button class="ti-x" aria-label="Fechar">×</button><b>🔔 ' + esc(a.titulo || 'Infoleg') + '</b>'
      + esc(a.texto) + '<br><small>' + esc((a.recebido_em || '').slice(11, 19)) + ' · clique para ver todos</small>';
    el.onclick = function(ev){ if (ev.target.classList.contains('ti-x')) { el.remove(); return; } location.href = '/avisos'; };
    pilha.insertBefore(el, pilha.firstChild);
    while (pilha.children.length > 4) pilha.lastChild.remove();
    setTimeout(function(){ el.remove(); }, 60000);
  }
  function buscar(){
    fetch('/api/avisos?apos=' + (ultimo || 0) + (ultimo === null ? '&limite=1' : ''), {cache: 'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (!d) return;
        if (ultimo !== null) d.avisos.slice().reverse().forEach(mostrar);  // na 1ª carga só marca o ponto de partida
        ultimo = Math.max(ultimo || 0, d.ultimo_id || 0);
      }).catch(function(){});
  }
  buscar();
  setInterval(buscar, 5000);
})();
</script>
